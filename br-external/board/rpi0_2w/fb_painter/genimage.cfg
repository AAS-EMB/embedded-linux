image boot.vfat {
    vfat {
        files = {
            "bcm2710-rpi-zero-2-w.dtb",
            "zImage",
            "rpi-firmware/start.elf",
            "rpi-firmware/fixup.dat",
            "rpi-firmware/bootcode.bin",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/overlays",
            "config.txt",
        }
    }
    size = 32M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}